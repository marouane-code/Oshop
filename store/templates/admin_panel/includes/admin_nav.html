{% load static %}
{% with url_name=request.resolver_match.url_name %}
<div class="admin-nav-wrapper">
  
  <!-- Admin Header Row -->
  <div class="admin-nav-top">
    <div class="admin-brand">
      <div class="admin-brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3c0 .8.3 1.5.8 2L2.5 15.5A2 2 0 0 0 4 19h16a2 2 0 0 0 1.5-3.5L14.2 7c.5-.5.8-1.2.8-2a3 3 0 0 0-3-3z"/>
        </svg>
      </div>
      <div>
        <h2 class="admin-brand-title" style="color:#FFFFFF; font-weight:800;">Click Shop Admin Console</h2>
        <span class="admin-status-badge">
          <span class="admin-pulse-dot"></span> Console Active
        </span>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="admin-actions">
      <a href="{% url 'store:admin_article_create' %}" class="btn btn-gold admin-quick-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Article
      </a>
      <a href="{% url 'store:admin_category_create' %}" class="btn btn-outline-gold admin-quick-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Category
      </a>
      <a href="{% url 'store:home' %}" class="btn btn-dark admin-quick-btn" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Live Store
      </a>
    </div>
  </div>

  <!-- Primary Tab Navigation Links -->
  <nav class="admin-nav-tabs" aria-label="Admin Navigation">
    
    <!-- 1. Dashboard -->
    <a href="{% url 'store:admin_dashboard' %}" class="admin-tab-btn {% if url_name == 'admin_dashboard' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
      </svg>
      Dashboard
    </a>

    <!-- 2. In-Store POS -->
    <a href="{% url 'store:admin_pos' %}" class="admin-tab-btn pos-tab {% if url_name == 'admin_pos' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      In-Store POS
    </a>

    <!-- 3. Orders & Sales -->
    <a href="{% url 'store:admin_orders' %}" class="admin-tab-btn {% if url_name == 'admin_orders' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      Orders & Sales
    </a>

    <!-- 4. Categories -->
    <a href="{% url 'store:admin_categories' %}" class="admin-tab-btn {% if 'category' in url_name %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
      </svg>
      Categories
    </a>

    <!-- 5. Articles & Inventory -->
    <a href="{% url 'store:admin_articles' %}" class="admin-tab-btn {% if 'article' in url_name %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
      </svg>
      Articles & Stock
    </a>

  </nav>
</div>
{% endwith %}
