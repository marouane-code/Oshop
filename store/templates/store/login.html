{% extends 'base.html' %}
{% load static %}

{% block title %}Connexion & Inscription — Mario Clothes Casablanca{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; padding-top: 3rem; padding-bottom: 6rem;">
  <div class="login-card">
    
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; background: var(--warm-50); border: 1px solid var(--warm-200); margin-bottom: 1rem; color: var(--ink);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <h1 style="font-family: var(--font-display); font-size: clamp(1.6rem, 3.5vw, 2rem); font-weight: 900; letter-spacing: -0.01em; color: var(--ink); margin: 0 0 0.35rem;">Espace Client</h1>
      <p style="color: var(--warm-600); font-size: 0.86rem; margin: 0;">Connectez-vous à votre compte ou créez votre profil</p>
    </div>

    <!-- Auth Toggle Tabs -->
    <div style="display: flex; background: var(--warm-50); padding: 4px; border-radius: var(--r-sm); margin-bottom: 2rem; border: 1px solid var(--warm-200);">
      <button type="button" id="tabLoginBtn" class="btn btn-dark" style="flex: 1; border-radius: var(--r-sm); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.65rem;" onclick="switchAuthTab('login')">
        Se Connecter
      </button>
      <button type="button" id="tabRegisterBtn" class="btn btn-ghost" style="flex: 1; border-radius: var(--r-sm); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.65rem;" onclick="switchAuthTab('register')">
        Créer un Compte
      </button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" method="POST" action="{% url 'store:login' %}{% if next_url %}?next={{ next_url }}{% endif %}">
      {% csrf_token %}
      <input type="hidden" name="auth_action" value="login">
      {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
      {% endif %}

      <div class="form-group">
        <label class="form-label">Email ou Nom d'utilisateur</label>
        <input type="text" name="login_username" required class="form-control" placeholder="votre@email.com">
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label class="form-label">Mot de Passe</label>
        <input type="password" name="login_password" required class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-red" style="width: 100%; padding: 0.95rem; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; box-shadow: var(--shadow-sm);">
        Se Connecter
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" method="POST" action="{% url 'store:login' %}" style="display: none;">
      {% csrf_token %}
      <input type="hidden" name="auth_action" value="register">

      <div class="form-group">
        <label class="form-label">Nom Complet</label>
        <input type="text" name="reg_full_name" id="regFullName" class="form-control" placeholder="ex. Hamza Mansouri">
      </div>

      <div class="form-group">
        <label class="form-label">Adresse Email</label>
        <input type="email" name="reg_email" id="regEmail" class="form-control" placeholder="nom@exemple.com">
      </div>

      <div class="form-group">
        <label class="form-label">Téléphone (WhatsApp)</label>
        <input type="tel" name="reg_phone" id="regPhone" class="form-control" placeholder="0661234567">
      </div>

      <div class="form-row-2col">
        <div class="form-group">
          <label class="form-label">Ville</label>
          <input type="text" name="reg_city" id="regCity" class="form-control" placeholder="Casablanca">
        </div>
        <div class="form-group">
          <label class="form-label">Adresse</label>
          <input type="text" name="reg_address" id="regAddress" class="form-control" placeholder="Rue / N°">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label class="form-label">Créer un Mot de Passe</label>
        <input type="password" name="reg_password" id="regPassword" class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-red" style="width: 100%; padding: 0.95rem; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; box-shadow: var(--shadow-sm);">
        Créer mon Compte
      </button>
    </form>

  </div>
</div>

<script>
  function switchAuthTab(tab) {
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLoginBtn = document.getElementById('tabLoginBtn');
    const tabRegisterBtn = document.getElementById('tabRegisterBtn');

    if (tab === 'login') {
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
      tabLoginBtn.className = 'btn btn-dark';
      tabRegisterBtn.className = 'btn btn-ghost';
    } else {
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
      tabLoginBtn.className = 'btn btn-ghost';
      tabRegisterBtn.className = 'btn btn-dark';
    }
  }
</script>
{% endblock %}
